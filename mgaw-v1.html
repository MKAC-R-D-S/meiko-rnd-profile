  <style>
    :root {
      --bg: #08111f;
      --panel: rgba(10, 20, 34, 0.78);
      --border: rgba(255, 255, 255, 0.1);
      --text: #e7eef8;
      --muted: #9fb3ca;
      --brand: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(88, 166, 255, 0.18), transparent 30%),
        radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.12), transparent 24%),
        var(--bg);
      color: var(--text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(8, 17, 31, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .topbar a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      transition: all 0.2s ease;
    }

    .topbar a.primary {
      background: linear-gradient(90deg, #1677ff, #58a6ff);
      border-color: transparent;
      color: white;
    }

    .topbar a:hover {
      transform: translateY(-1px);
      border-color: rgba(88, 166, 255, 0.38);
    }

    .frame-wrap {
      width: 100%;
      height: calc(100vh - 70px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }

    .fallback {
      padding: 32px 22px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .frame-wrap {
        height: calc(100vh - 132px);
      }
    }
